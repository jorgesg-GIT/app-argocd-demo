apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: my-first-app-prod
resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: my-first-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Ingress
      name: my-first-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.example.com

configMapGenerator:
  - name: my-first-app-config
    behavior: merge
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=warn
