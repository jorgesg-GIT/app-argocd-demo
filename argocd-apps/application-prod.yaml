apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-first-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/tu-org/tu-repo.git   # <- cambia por tu repo real
    targetRevision: main
    path: overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: my-first-app-prod

  # En prod dejamos el sync en manual (sin bloque "automated"): tú
  # decides cuándo aplicar los cambios desde la UI o el CLI de ArgoCD.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
